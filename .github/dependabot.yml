version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "toreau/gh-workflows/.github/workflows/container-build-attest.yml"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production-minor-patch:
        applies-to: version-updates
        patterns:
          - "@astrojs/sitemap"
          - "astro"
          - "marked"
          - "isomorphic-dompurify"
          - "tailwindcss"
          - "@tailwindcss/*"
        update-types:
          - minor
          - patch
      dev-tooling:
        applies-to: version-updates
        patterns:
          - "@astrojs/check"
          - "@playwright/*"
          - "@axe-core/*"
          - "typescript"
          - "vitest"
          - "pagefind"
          - "sharp"
          - "wrangler"
        update-types:
          - minor
          - patch
