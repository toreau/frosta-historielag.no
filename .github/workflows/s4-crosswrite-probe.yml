# S4 verification (temporary): GHCR cross-package WRITE-DENIAL probe.
# Uses frosta's own GITHUB_TOKEN (github.token) to attempt pushing a disposable
# evidence-only tag into toreau/astronomy-api. Expected: DENIED (403). If
# unexpectedly ACCEPTED the step fails (run red) and S4 must STOP: the
# cross-package write defect must be resolved before any cutover.
# The tag s4-crosswrite-<runid> never collides with production tags.
name: s4-crosswrite-probe

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Attempt cross-package push (expected DENIED)
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          target="ghcr.io/toreau/astronomy-api:s4-crosswrite-${RUN_ID}"
          mkdir -p /tmp/probe
          printf 'FROM busybox:1.36\n' > /tmp/probe/Dockerfile
          echo "attempting push to ${target}"
          if docker buildx build --push --platform linux/amd64 -t "$target" /tmp/probe > /tmp/probe.log 2>&1; then
            echo "::error::UNEXPECTED CROSS-WRITE: frosta token CAN WRITE astronomy-api (${target})"
            echo "RESULT=ACCEPTED"
            exit 1
          else
            echo "RESULT=DENIED (expected)"
            tail -3 /tmp/probe.log
          fi
