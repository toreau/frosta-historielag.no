name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (astro check)
        run: npm run check

      - name: Unit + content integrity tests
        run: npx vitest run tests/unit tests/content

      - name: Build
        run: npm run build

      - name: Build invariant tests
        run: npx vitest run tests/build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  docker:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: toreau/gh-workflows/.github/workflows/container-build-push.yml@v1
    with:
      image: ghcr.io/toreau/frosta-historielag.no
      dockerfile: Dockerfile
      platform: linux/arm64
      runner: ubuntu-24.04-arm
      tags: |
        ghcr.io/toreau/frosta-historielag.no:main-${{ github.sha }}
        ghcr.io/toreau/frosta-historielag.no:latest
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  attest:
    needs: docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image digest
        id: digest
        run: |
          d=$(docker buildx imagetools inspect "ghcr.io/toreau/frosta-historielag.no:main-${{ github.sha }}" --format '{{.Manifest.Digest}}')
          echo "digest=$d" >> "$GITHUB_OUTPUT"
          echo "resolved $d"
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ghcr.io/toreau/frosta-historielag.no:main-${{ github.sha }}
          format: spdx-json
          output-file: report.spdx.json
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4
        with:
          subject-name: ghcr.io/toreau/frosta-historielag.no
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4
        with:
          subject-name: ghcr.io/toreau/frosta-historielag.no
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: report.spdx.json
          push-to-registry: true
      - name: Verify attestations (fail-fast)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          for i in 1 2 3 4 5; do
            gh attestation verify "oci://ghcr.io/toreau/frosta-historielag.no@${DIGEST}" -R toreau/frosta-historielag.no \
              --predicate-type https://slsa.dev/provenance/v1 \
              && { echo "SLSA provenance verified"; break; }
            [ "$i" -lt 5 ] && sleep 5
          done
          gh attestation verify "oci://ghcr.io/toreau/frosta-historielag.no@${DIGEST}" -R toreau/frosta-historielag.no \
            --predicate-type https://spdx.dev/Document/v2.3
          echo "attestations verified for ${DIGEST}"
