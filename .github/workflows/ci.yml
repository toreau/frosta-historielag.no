name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (astro check)
        run: npm run check

      - name: Unit + content integrity tests
        run: npx vitest run tests/unit tests/content

      - name: Build
        run: npm run build

      - name: Build invariant tests
        run: npx vitest run tests/build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  builder:
    needs: test
    if: github.ref == 'refs/heads/main' && needs.test.result == 'success'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: toreau/gh-workflows/.github/workflows/container-build-attest.yml@d31696bf041c1462f2b5fd6fcf9b557b6b1e7894

  dispatch:
    needs: builder
    if: github.ref == 'refs/heads/main' && needs.builder.result == 'success'
    uses: toreau/gh-workflows/.github/workflows/dispatch.yml@v1
    with:
      target-repo: toreau/k8s-research
      event-type: app-image-pushed
      payload: '{"app":"frosta-historielag","sha":"${{ github.sha }}","digest":"${{ needs.builder.outputs.digest }}"}'
    secrets:
      token: ${{ secrets.K8S_RESEARCH_PAT }}
      hmac-secret: ${{ secrets.DISPATCH_HMAC_KEY }}
