name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (HIGH+)
        run: npm audit --audit-level=high

      - name: Type check (astro check)
        run: npm run check

      - name: Unit + content integrity tests
        run: npx vitest run tests/unit tests/content

      - name: Build
        run: npm run build

      - name: Build invariant tests
        run: npx vitest run tests/build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  builder:
    needs: test
    if: github.ref == 'refs/heads/main' && needs.test.result == 'success'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: toreau/gh-workflows/.github/workflows/container-build-attest.yml@373df7517487bd20ac55a0986926677c0ddcbcf6

  dispatch:
    needs: builder
    if: github.ref == 'refs/heads/main' && needs.builder.result == 'success'
    permissions: {}
    uses: toreau/gh-workflows/.github/workflows/dispatch.yml@19c65c9683f649cab7d3831a3bbc66451e756ebe
    with:
      target-repo: toreau/k8s-research
      event-type: app-image-pushed
      payload: '{"app":"frosta-historielag","sha":"${{ github.sha }}","digest":"${{ needs.builder.outputs.digest }}"}'
    secrets:
      token: ${{ secrets.K8S_RESEARCH_PAT }}
      hmac-secret: ${{ secrets.DISPATCH_HMAC_KEY }}
