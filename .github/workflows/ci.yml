name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (HIGH+)
        run: npm audit --audit-level=high

      - name: Type check (astro check)
        run: npm run check

      - name: Unit + content integrity tests
        run: npx vitest run tests/unit tests/content

      - name: Build
        run: npm run build

      - name: Build invariant tests
        run: npx vitest run tests/build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  builder:
    needs: test
    if: github.ref == 'refs/heads/main' && needs.test.result == 'success'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: toreau/gh-workflows/.github/workflows/container-build-attest.yml@373df7517487bd20ac55a0986926677c0ddcbcf6

  image-scan:
    needs: builder
    if: github.ref == 'refs/heads/main' && needs.builder.result == 'success'
    permissions:
      packages: read
    uses: toreau/gh-workflows/.github/workflows/container-scan.yml@5de3d9440803452670476182508870b27d030962
    with:
      image: ghcr.io/toreau/frosta-historielag.no
      digest: ${{ needs.builder.outputs.digest }}

  dispatch:
    needs: [builder, image-scan]
    if: github.ref == 'refs/heads/main' && needs.builder.result == 'success' && needs.image-scan.result == 'success'
    permissions: {}
    uses: toreau/gh-workflows/.github/workflows/dispatch.yml@19c65c9683f649cab7d3831a3bbc66451e756ebe
    with:
      target-repo: toreau/k8s-research
      event-type: app-image-pushed
      payload: '{"app":"frosta-historielag","sha":"${{ github.sha }}","digest":"${{ needs.builder.outputs.digest }}"}'
    secrets:
      token: ${{ secrets.K8S_RESEARCH_PAT }}
      hmac-secret: ${{ secrets.DISPATCH_HMAC_KEY }}
