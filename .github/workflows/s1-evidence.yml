# S1 evidence (temporary): caller/source for the reusable-signer experiment.
#
# Calls the evidence builder in toreau/gh-workflows pinned to a full commit SHA.
# workflow_dispatch only. No dispatch to k8s-research, no promotion, no
# desired-state effect. k8s-research is read-only for S1.
name: s1-evidence

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  call:
    uses: toreau/gh-workflows/.github/workflows/attest-evidence.yml@d31696bf041c1462f2b5fd6fcf9b557b6b1e7894
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
